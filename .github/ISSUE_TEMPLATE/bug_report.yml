name: Fehler melden
description: Ein Fehlverhalten der Plattform melden
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine personenbezogenen Daten, Zugangsdaten oder Secrets eintragen.
        Sicherheitslücken bitte vertraulich über „Report a vulnerability“ melden.
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert, was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Betroffenes Modul
      placeholder: z. B. billing, booking, auth
  - type: dropdown
    id: environment
    attributes:
      label: Umgebung
      options:
        - lokal
        - staging
        - produktion
    validations:
      required: true
