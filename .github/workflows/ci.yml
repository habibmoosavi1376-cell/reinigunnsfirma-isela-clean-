name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan git history
        run: gitleaks git . --no-banner --redact --verbose

  repo-guard:
    name: Repo guard (forbidden files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for forbidden files
        run: ./scripts/check-forbidden-files.sh

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint -color

  # ------------------------------------------------------------------------------------
  # Phase 1: application checks. Tool versions come from package.json (packageManager),
  # .nvmrc and the lockfile; installation is always frozen.
  # ------------------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint and format check
        run: pnpm run lint

      - name: Module boundaries
        run: pnpm run check:boundaries

      - name: No hard-coded location logic
        run: pnpm run check:hardcoding

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

  web-build:
    name: Web build (production) and client-bundle secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Random canary values stand in for server secrets during the build; the scan below
      # fails if any of them (or their variable names) end up in client assets.
      - name: Generate canary secrets
        run: |
          {
            echo "AUTH_SECRET=canary-$(openssl rand -hex 24)"
            echo "IDENTITY_HASH_PEPPER=canary-$(openssl rand -hex 24)"
            echo "DATABASE_URL=postgres://canary:canary-$(openssl rand -hex 8)@db.invalid:5432/canary"
            echo "SMTP_USER=canary-user-$(openssl rand -hex 4)"
            echo "SMTP_PASSWORD=canary-$(openssl rand -hex 16)"
            echo "GEOCODING_API_KEY=canary-$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Build web app (next build)
        run: pnpm --filter @isela/web run build

      - name: Client bundle must not contain server secrets
        run: pnpm run check:client-bundle

  e2e:
    name: E2E (Playwright, production build, PostgreSQL + PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # postgis/postgis:16-3.4, pinned by digest.
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: isela_e2e
          POSTGRES_DB: isela_e2e
          # Ephemeral, job-local database without credentials; not reachable from outside the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isela_e2e -d isela_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://isela_e2e@localhost:5432/isela_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright (version from the lockfile)
        run: pnpm --filter @isela/web exec playwright install --with-deps chromium

      - name: Build web app (next build)
        run: pnpm --filter @isela/web run build

      # Resets the dedicated E2E database, applies all migrations, seeds reference data and
      # the RBAC catalogue, starts a local TEST-ONLY SMTP sink and `next start`.
      - name: E2E tests
        run: pnpm run test:e2e

  integration:
    name: Integration tests (PostgreSQL + PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # postgis/postgis:16-3.4, pinned by digest.
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: isela_test
          POSTGRES_DB: isela_test
          # Ephemeral, job-local database without credentials; not reachable from outside the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isela_test -d isela_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://isela_test@localhost:5432/isela_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migration drift check
        run: pnpm run db:check

      - name: Integration and security tests (applies all migrations to an empty database)
        run: pnpm run test:integration

  dependencies:
    name: Dependency audit and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Vulnerability audit
        run: pnpm run check:audit

      - name: License policy
        run: pnpm run check:licenses

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
